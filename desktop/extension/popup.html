<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>视频发布台</title>
  <style>
    body { width: 330px; margin: 0; color: #263438; background: #fff; font: 13px/1.5 system-ui, sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #e4e9eb; }
    strong { font-size: 14px; }
    main { padding: 12px 16px 16px; }
    p { margin: 0 0 10px; color: #617077; }
    #context { padding: 8px 10px; background: #f1f5f6; border-radius: 4px; }
    #list { display: grid; gap: 8px; max-height: 330px; overflow-y: auto; }
    article { display: flex; align-items: center; gap: 8px; padding: 10px; border: 1px solid #e0e6e8; border-radius: 4px; }
    article div { min-width: 0; flex: 1; }
    article b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    small { color: #738188; }
    button { border: 1px solid #cbd5d8; border-radius: 4px; background: #fff; color: #263438; padding: 5px 9px; cursor: pointer; font: inherit; white-space: nowrap; }
    button.primary { border-color: #17657b; background: #17657b; color: white; }
    button:disabled { opacity: .45; cursor: default; }
    #message { color: #b42318; white-space: pre-wrap; }
    footer { padding-top: 12px; }
  </style>
</head>
<body>
  <header><strong>视频发布台</strong><span>抖音</span></header>
  <main>
    <p id="context">正在检查当前标签页</p>
    <div id="list"></div>
    <p id="message" role="status"></p>
    <footer><button id="open-upload" hidden>在新标签打开抖音上传页</button></footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
